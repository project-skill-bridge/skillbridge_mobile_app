name: CI/CD Integration

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/checkout/action.yml
      - uses: ./.github/actions/setup-java/action.yml
      - uses: ./.github/actions/setup-node/action.yml
      - uses: ./.github/actions/gradle-setup/action.yml
      - uses: ./.github/actions/build-apk/action.yml
      - uses: ./.github/actions/upload-apk/action.yml

  deploy:
    needs: android-build
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/download-apk